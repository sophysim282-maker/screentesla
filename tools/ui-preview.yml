name: ScreenLinkPreview
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  ScreenLinkPreview:
    type: application
    platform: iOS
    sources:
    - path: ../App/ScreenLinkHomeView.m
    - path: ../App/ScreenLinkHomeView.h
    - path: ui/Preview.m
    - path: ui/ControllerFixtures.m
    - path: ../App/main.m
      compilerFlags: -Dmain=ScreenLinkProductionMain -DAppDelegate=ScreenLinkTestDelegate -DController=ScreenLinkTestController
    - path: ../App/SLDisconnectFlow.m
    - path: ../Shared/SLWidgetRoute.h
    - path: ../App/ScreenLinkCover.png
    - path: ../App/BrandAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.vpn3333
        PRODUCT_NAME: ScreenLinkPreview
        CLANG_ENABLE_OBJC_ARC: true
        HEADER_SEARCH_PATHS:
        - $(SRCROOT)/../App
        - $(SRCROOT)/../RTC
        - $(SRCROOT)/../Shared
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
    info:
      path: ui/Preview-Info.plist
      properties:
        CFBundleDisplayName: ScreenLink 3333
        CFBundleShortVersionString: 0.20.23
        CFBundleVersion: '60'
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
        - CFBundleURLName: ScreenLink
          CFBundleURLSchemes: [screenlink3333]
        NSLocalNetworkUsageDescription: Cloud UI test fixture.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
    - target: ScreenLinkPreviewWidgets
      embed: true
    - sdk: ReplayKit.framework
    - sdk: CoreVideo.framework
    - sdk: AVFoundation.framework
    - sdk: UIKit.framework
  ScreenLinkPreviewWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: ../Widgets
    - path: ../Shared/ScreenLinkActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.vpn3333.Widgets
        SWIFT_VERSION: '5.0'
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
    dependencies:
    - sdk: WidgetKit.framework
    - sdk: SwiftUI.framework
    - sdk: ActivityKit.framework
    info:
      path: ui/Widget-Info.plist
      properties:
        CFBundleDisplayName: ScreenLink 3333
        CFBundleShortVersionString: 0.20.23
        CFBundleVersion: '60'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ScreenLinkDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - path: ui/DashboardUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.preview.uitests
        SWIFT_VERSION: '5.0'
        GENERATE_INFOPLIST_FILE: true
    dependencies:
    - target: ScreenLinkPreview
schemes:
  ScreenLinkPreview:
    build:
      targets:
        ScreenLinkPreview: all
    test:
      targets: [ScreenLinkDashboardUITests]
