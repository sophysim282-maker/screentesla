name: Late video output regression checks
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and continuous-GOP regression
        run: |
          node --check App/CanvasPlayer.js
          node --check App/CanvasShell.js
          node tools/test_playback_profile.cjs
          node tools/test_video_lateness.cjs App/CanvasPlayer.js
          curl --fail --location https://raw.githubusercontent.com/sophysim282-maker/screentesla/7494bcbb7e53b0ecef7412ab0589312012889ecf/App/CanvasPlayer.js -o /tmp/build62-canvas.js
          if node tools/test_video_lateness.cjs /tmp/build62-canvas.js; then
            echo "Build62 unexpectedly passed late output regression"; exit 1
          fi
          node tools/test_video_continuity.cjs App/CanvasPlayer.js
          curl --fail --location https://raw.githubusercontent.com/sophysim282-maker/screentesla/38bbf3af9498963709a4e2fbd6a136f722caf67d/App/CanvasPlayer.js -o /tmp/build60-canvas.js
          if node tools/test_video_continuity.cjs /tmp/build60-canvas.js; then
            echo "Baseline unexpectedly passed"; exit 1
          fi
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 tools/fetch_canvas.py
          curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/140.0.7339.207/linux64/chrome-linux64.zip -o /tmp/chrome140.zip
          unzip -q /tmp/chrome140.zip -d /tmp/screenlink-chrome140
          echo "SCREENLINK_CHROME_BIN=/tmp/screenlink-chrome140/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Fullscreen and player regression checks
        run: |
          node tools/test_video_fullscreen.cjs
          node tools/test_canvas_transport.cjs
          node tools/test_canvas_reconnect.cjs
          node tools/test_canvas_prefetch.cjs App/CanvasPlayer.js
          node tools/test_canvas_lifecycle.cjs App/CanvasPlayer.js
          node tools/test_canvas_buffer.cjs
          node tools/test_canvas_engine.cjs App/CanvasPlayer.js
          node tools/test_canvas_horizon.cjs App/CanvasPlayer.js
      - name: Real 1080p video recovery with continuous audio
        run: |
          mkdir -p build/recovery
          ffmpeg -v error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 24 -c:v libx264 -preset ultrafast -bf 2 -g 60 -sc_threshold 0 -c:a aac -hls_time 2 -hls_playlist_type vod -hls_segment_filename build/recovery/part%02d.ts build/recovery/master.m3u8
          node --require ./tools/test_browser_engine.cjs tools/test_video_recovery.cjs App build/recovery 2>&1 | tee build/profile-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-profile-cloud-logs
          path: build/profile-test.log
          retention-days: 7
