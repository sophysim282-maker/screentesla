name: Duo preview 171
# Build 171: real iPhone Duo simulator screenshots with Xcode 27.1. Run 7.
on:
  push:
    branches: ['release/build171-duo-glass']
    paths: ['.github/workflows/duopreview171.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          bash tools/preview_duo.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-ui
          path: build/duo-ui
          retention-days: 7
