name: Build145 phone sound
# Build 145: phone sound of other apps (Apple ALAC decoder, newer sound lock). Run 3.
on:
  push:
    branches: ['release/build145-phone-sound']
    paths: ['.github/workflows/phonesound145.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 tools/fetch_hls.py
          python3 tools/fetch_canvas.py
          curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/140.0.7339.207/linux64/chrome-linux64.zip -o /tmp/chrome140.zip
          unzip -q /tmp/chrome140.zip -d /tmp/screenlink-chrome140
      - name: Verify car page, reconnect and unchanged player behavior
        run: |
          node --check App/CanvasShell.js
          node tools/test_live_reconnect.cjs
          node tools/test_website_recovery.cjs App
          node tools/test_rescue_page.cjs
          node tools/test_car_map_js.cjs App
          node tools/test_video_fullscreen.cjs
          node tools/test_video_lateness.cjs App/CanvasPlayer.js
          node tools/test_video_continuity.cjs App/CanvasPlayer.js
          git fetch --depth=1 origin release/build64-glass
          git diff --exit-code FETCH_HEAD -- App/MediaPlayer.html
          git fetch --depth=1 origin release/build83-stable-keep-alive && git diff --exit-code FETCH_HEAD -- App/BrowserVideoPlayer.js && git diff --stat FETCH_HEAD -- App/CanvasPlayer.js
          node tools/test_decoder_fallback.cjs App/CanvasPlayer.js
          node tools/test_quality_cap.cjs App/CanvasPlayer.js
      - name: Real video on the car website with both players
        env:
          SCREENLINK_CHROME_BIN: /tmp/screenlink-chrome140/chrome-linux64/chrome
        run: |
          mkdir -p build/pure build/long
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 20 -c:v libx264 -preset ultrafast -g 60 -c:a aac -hls_time 2 -hls_playlist_type vod -hls_segment_filename build/long/part%02d.ts build/long/master.m3u8
          node tools/test_browser_video.cjs App build/long
          node tools/test_map_mini.cjs App build/long
          ffmpeg -v error -y -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -movflags +faststart build/file.mp4
          node tools/test_file_video.cjs App build/file.mp4
          node tools/test_waiting_screen.cjs App build/file.mp4
          mkdir -p build/sixty
          ffmpeg -v error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 60 -c:v libx264 -preset ultrafast -g 60 -c:a aac -hls_time 5 -hls_playlist_type vod -hls_segment_filename build/sixty/part%02d.ts build/sixty/master.m3u8
          git show origin/release/build75-car-log:App/CanvasPlayer.js > /tmp/player75.js || (git fetch --depth=1 origin release/build75-car-log && git show FETCH_HEAD:App/CanvasPlayer.js > /tmp/player75.js)
          SEGMENT_DELAY_MS=600 PAUSE_AT=30 PAUSE_MS=10000 PLAYER=/tmp/player75.js node tools/test_network_pause.cjs App build/sixty expect-freeze
          SEGMENT_DELAY_MS=600 PAUSE_AT=30 PAUSE_MS=10000 node tools/test_network_pause.cjs App build/sixty
          git show origin/release/build93-4k-test:App/CanvasPlayer.js > /tmp/player93.js || (git fetch --depth=1 origin release/build93-4k-test && git show FETCH_HEAD:App/CanvasPlayer.js > /tmp/player93.js)
          BLACKOUT=1 SEGMENT_DELAY_MS=600 PAUSE_AT=30 PAUSE_MS=12000 PLAYER=/tmp/player93.js node tools/test_network_pause.cjs App build/sixty expect-freeze
          BLACKOUT=1 SEGMENT_DELAY_MS=600 PAUSE_AT=30 PAUSE_MS=12000 node tools/test_network_pause.cjs App build/sixty
          git fetch --depth=1 origin release/build78-quality-cap && git show FETCH_HEAD:App/CanvasPlayer.js > /tmp/player78.js
          STARTUP=1 SEGMENT_DELAY_MS=1100 PAUSE_AT=20 PLAYER=/tmp/player78.js node tools/test_network_pause.cjs App build/sixty expect-freeze
          STARTUP=1 SEGMENT_DELAY_MS=1100 PAUSE_AT=20 node tools/test_network_pause.cjs App build/sixty
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=60 -t 12 -c:v libx264 -preset ultrafast -tune zerolatency -x264-params aud=1:keyint=120:scenecut=0 -f h264 build/source.h264
          cc tools/test_fmp4.c -o build/mux
          build/mux build/source.h264 build/live.mp4
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -c:v libx264 -preset ultrafast -tune zerolatency -g 60 -c:a aac -hls_time 2 -hls_playlist_type vod -hls_segment_filename build/pure/part%02d.ts build/pure/master.m3u8
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 10 -c:v libx264 -preset ultrafast -g 60 -c:a aac -hls_time 2 -hls_segment_type fmp4 -hls_playlist_type vod -hls_segment_filename build/pure/fragment%02d.m4s build/pure/fragmented.m3u8
          python3 tools/create_packed_audio_fixture.py build/pure
          node --require ./tools/test_browser_engine.cjs tools/test_pure_canvas.cjs App build/pure build/live.mp4
  native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify widget commands and loopback transport
        run: |
          mkdir -p build
          xcrun --sdk macosx clang -Wall -Wextra -Werror -fobjc-arc -IApp tools/test_viewer_controls.m App/ViewerControls.m -framework Foundation -o build/viewer-controls
          build/viewer-controls
          xcrun --sdk macosx clang -Wall -Werror -fobjc-arc -IApp tools/test_stream_notifier.m App/StreamNotifier.m -framework Foundation -framework UserNotifications -o build/stream-notifier
          build/stream-notifier
          xcrun --sdk macosx swiftc Shared/CarPlayerConnection.swift tools/test_car_player_connection.swift -o build/test-car-player-connection
          python3 tools/test_car_player_connection.py
      - name: Compile and verify iPhone package on cloud Mac
        run: |
          brew install xcodegen autoconf automake libtool openssl@3
          bash tools/build.sh
          xcrun --sdk macosx clang -fobjc-arc -IShared tools/test_widget_routes.m -framework Foundation -o build/widget-routes
          build/widget-routes
      - name: Verify intent metadata and raw package
        run: |
          python3 - <<'PY'
          import plistlib,zipfile
          with zipfile.ZipFile('build/ScreenLink-AirPlay-Lab-unsigned.ipa') as z:
              names=z.namelist()
              assert not any('/PrivateTLS/' in n or n.endswith('.mobileprovision') for n in names)
              widget=next(n for n in names if n.endswith('/ScreenLinkWidgets.appex/Info.plist'))
              plist=plistlib.loads(z.read(widget))
              assert plist['NSAppTransportSecurity']['NSExceptionDomains']['127.0.0.1']['NSExceptionAllowsInsecureHTTPLoads']
              prefix=widget.removesuffix('Info.plist')
              metadata=[n for n in names if n.startswith(prefix+'Metadata.appintents/') and not n.endswith('/')]
              assert metadata and any(b'CarPlayerIntent' in z.read(n) for n in metadata), 'Missing compiled widget intent metadata'
          PY
      - name: Add website certificate from private Secrets
        id: identity
        env:
          SCREENLINK_TLS_FULLCHAIN: ${{ secrets.SCREENLINK_TLS_FULLCHAIN }}
          SCREENLINK_TLS_KEY: ${{ secrets.SCREENLINK_TLS_KEY }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -z "$SCREENLINK_TLS_KEY" ] || [ -z "$SCREENLINK_TLS_FULLCHAIN" ]; then echo "No certificate Secrets: uploading the raw IPA."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$REPO_PRIVATE" != "true" ]; then echo "Repository is public: refusing to put the certificate in a download." >&2; exit 1; fi
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl" python3 tools/add_identity_ci.py build/ScreenLink-AirPlay-Lab-unsigned.ipa build/ScreenLink-ready-to-sign.ipa
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.identity.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-build145-READY-TO-SIGN
          path: build/ScreenLink-ready-to-sign.ipa
          retention-days: 2
      - if: steps.identity.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-build145-RAW-NOT-FOR-INSTALL
          path: build/ScreenLink-AirPlay-Lab-unsigned.ipa
          retention-days: 2
  preview:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Home preview in an iPhone simulator (motion video + screenshots)
        run: bash tools/preview_home86.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-build145-HOME-PREVIEW
          path: build/ui
          retention-days: 7
