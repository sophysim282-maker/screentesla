name: Xcode probe
# Run 6: read the camera-accessory (outside screen) and hinge docs, list iPhone Duo simulators.
on:
  push:
    branches: ['release/xcode-probe']
    paths: ['.github/workflows/xcodeprobe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"; F="$SDK/System/Library/Frameworks"
          echo "=== CameraCaptureAccessory"; grep -rn -B12 -A6 "CameraCaptureAccessory" "$F/UIKit.framework/Headers" | head -120
          echo "=== other frameworks"; grep -rlE "CameraCaptureAccessory|captureAccessory|UIHinge|outerDisplay" "$F"/*/Headers 2>/dev/null | head
          grep -rn -B6 -A10 -iE "captureAccessory" "$F/AVFoundation.framework/Headers" "$F/AVKit.framework/Headers" 2>/dev/null | head -80
          echo "=== swift"; find "$F/UIKit.framework" -name "*.swiftinterface" | head -1 | xargs grep -n -B3 -A3 -iE "cameraCaptureAccessory|UIHinge" | head -60
          echo "=== UIHinge"; sed -n 1,80p "$F/UIKit.framework/Headers/UIHinge.h"; ls "$F/UIKit.framework/Headers" | grep -i hinge
          echo "=== simulators"; xcrun simctl list devicetypes | grep -iE "duo|fold|17|18|19|Air" 
          xcrun simctl list runtimes
