name: Xcode probe
# Lists the Xcode versions on the cloud Macs (for the iPhone Duo build). Run 4: the xcode-27 label.
on:
  push:
    branches: ['release/xcode-probe']
    paths: ['.github/workflows/xcodeprobe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, xcode-27-xlarge, macos-27, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers || true
          ls -d /Applications/Xcode* || true
          xcodebuild -version || true
          xcodebuild -showsdks | grep -i iphoneos || true
