name: Phone-local STUN through routed browser NAT
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Install official Chrome 140 and build production STUN responder
        run: |
          curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/140.0.7339.207/linux64/chrome-linux64.zip -o /tmp/chrome140.zip
          unzip -q /tmp/chrome140.zip -d /tmp/screenlink-nat-chrome
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -pthread tools/test_stun.c RTC/SLStun.c -o build/test-stun
          build/test-stun
          cc -std=c11 -Wall -Wextra -Werror -pthread tools/stun_server.c RTC/SLStun.c -o build/stun-server
          cat > build/nat-chrome <<'SH'
          #!/bin/bash
          exec ip netns exec slbrowser "$SCREENLINK_REAL_CHROME" "$@"
          SH
          chmod +x build/nat-chrome
      - name: Reproduce private browser subnet behind hotspot NAT
        run: |
          sudo bash tools/setup_nat_test.sh
          sudo ip netns exec slphonebrowser env SCREENLINK_REAL_CHROME=/tmp/screenlink-nat-chrome/chrome-linux64/chrome SCREENLINK_NAT_CHROME="$PWD/build/nat-chrome" node tools/test_stun_nat.cjs
      - name: Clean up isolated test network
        if: always()
        run: |
          sudo ip netns del slbrowser || true
          sudo ip netns del slrouter || true
          sudo ip netns del slphonebrowser || true
          sudo ip link del slphone || true
