<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenLink · Live Maps screen</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#080d15;color:#d6e6fa;height:100%;font:12px system-ui;display:flex;flex-direction:column}header{padding:8px;text-align:center;min-height:42px}#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:black}canvas{max-width:100%;max-height:100%;object-fit:contain}video{display:none}[hidden]{display:none!important}#stage{position:relative}#privacy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080d15;color:#d6e6fa;padding:24px;text-align:center}.stale canvas{opacity:.45}button{background:#253b57;color:white;border:1px solid #6387b6;border-radius:5px;padding:4px 8px}</style>
<header><span id="status">Start ScreenLink screen broadcast, then open Google Maps.</span> <button id="hide">Hide screen</button> <button id="show">Show screen</button> <button id="retry">Reconnect</button></header><main id="stage"><canvas id="screen" width="444" height="960" aria-label="Live iPhone screen"></canvas><div id="privacy">Phone screen hidden. Open Google Maps before choosing Show screen.</div></main><video id="source" autoplay muted playsinline disableRemotePlayback></video>
<script>
const viewerOrigin=window.origin,rtcTransport=window.frameElement?.dataset.transport==='rtc';
const token=new URLSearchParams(location.search).get('token'),video=document.getElementById('source'),canvas=document.getElementById('screen'),status=document.getElementById('status'),cover=document.getElementById('privacy'),context=canvas.getContext('2d',{alpha:false});
const endpoint=path=>{const [route,...query]=path.split('&');return route+'?token='+encodeURIComponent(token)+(query.length?'&'+query.join('&'):'');},sleep=ms=>new Promise(r=>setTimeout(r,ms));
let generation=0,objectURL=null,orientation=1,closed=false,playing=false,privateScreen=true,localHold=false,lastPolicy=0,revision=0,activeEpoch='',frameReported=false;
const pending=new Set();
function notify(hidden,confirmed,frameReady=false){if(parent!==window)parent.postMessage({type:'screenlink-privacy',hidden,confirmed,frameReady,revision},viewerOrigin);}
function rtcRequest(path,options,signal){return new Promise((resolve,reject)=>{const channel=new MessageChannel();let finished=false;const close=()=>{signal.removeEventListener('abort',cancel);channel.port1.close();};const cancel=()=>{if(finished)return;finished=true;channel.port1.postMessage({cancel:true});close();reject(Error('Screen request cancelled'));};signal.addEventListener('abort',cancel,{once:true});channel.port1.onmessage=event=>{if(finished)return;finished=true;close();const item=event.data;if(item.error){reject(Error(item.error));return;}const headers=new Headers(item.headers||{});resolve({response:{status:item.status,ok:item.status>=200&&item.status<300,headers},bytes:item.bytes||new ArrayBuffer(0)});};parent.postMessage({type:'screenlink-screen-request',path,method:options.method||'GET',body:options.body||null},viewerOrigin,[channel.port2]);if(signal.aborted)cancel();});}
async function request(path,options={}){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),4000);pending.add(abort);try{if(rtcTransport){const result=await rtcRequest(path,options,abort.signal);if(!result.response.ok)throw Error('Screen HTTP '+result.response.status);return result;}const response=await fetch(endpoint(path),{cache:'no-store',...options,signal:abort.signal});if(response.status===403){parent.postMessage({type:'screenlink-expired'},viewerOrigin);throw Error('Viewer link changed');}const bytes=response.status===204?new ArrayBuffer(0):await response.arrayBuffer();if(!response.ok&&response.status!==204)throw Error('Stream HTTP '+response.status);return {response,bytes};}finally{clearTimeout(timer);pending.delete(abort);}}
async function info(){const {bytes}=await request('/screen/info');return JSON.parse(new TextDecoder().decode(bytes));}
function update(buffer,fn){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>finish(Error('Map decoder timed out')),4000);const finish=error=>{clearTimeout(timer);buffer.removeEventListener('updateend',ready);buffer.removeEventListener('error',bad);error?reject(error):resolve();};const ready=()=>finish(),bad=()=>finish(Error('Map decoder rejected stream'));buffer.addEventListener('updateend',ready);buffer.addEventListener('error',bad);try{fn();}catch(error){finish(error);}});}
function stopStream(){generation++;playing=false;frameReported=false;for(const abort of pending)abort.abort();pending.clear();video.pause();video.removeAttribute('src');video.load();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=null;canvas.dataset.epoch='';if(context){context.fillStyle='#000';context.fillRect(0,0,canvas.width,canvas.height);}cover.hidden=false;}
function hide(confirmed,text){privateScreen=true;stopStream();status.textContent=text;cover.textContent=text;notify(true,confirmed);}
async function run(meta,mine){
 try{
  if(!self.MediaSource)throw Error('This browser needs MediaSource support. Try current Chrome on the Mac.');
  const type='video/mp4; codecs="'+meta.codec+'"';if(!MediaSource.isTypeSupported(type))throw Error('Browser cannot decode this H.264 screen stream');
  const media=new MediaSource();objectURL=URL.createObjectURL(media);video.src=objectURL;
  await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Map player startup timed out')),5000);media.addEventListener('sourceopen',()=>{clearTimeout(timer);resolve();},{once:true});});if(mine!==generation)return;
  const buffer=media.addSourceBuffer(type);media.duration=Infinity;
  const init=await request('/screen/init.mp4');if(mine!==generation)return;if(init.response.headers.get('X-Stream-Epoch')!==meta.epoch)throw Error('Screen stream restarted');await update(buffer,()=>buffer.appendBuffer(init.bytes));if(mine!==generation)return;canvas.dataset.epoch=meta.epoch;let after=0,started=false;
  while(!closed&&!privateScreen&&mine===generation){
   const packet=await request('/screen/segments&after='+after+'&epoch='+encodeURIComponent(meta.epoch));if(mine!==generation)return;
   if(packet.response.status===204){await sleep(30);continue;}if(packet.response.headers.get('X-Stream-Epoch')!==meta.epoch)throw Error('Screen stream restarted');
   await update(buffer,()=>buffer.appendBuffer(packet.bytes));if(mine!==generation)return;after=packet.response.headers.get('X-Last-ID')||after;
   if(video.error)throw Error(video.error.message||'Screen decoder error');
   if(video.buffered.length){const end=video.buffered.end(video.buffered.length-1),begin=video.buffered.start(video.buffered.length-1);if(!started&&end-begin>=0.12){video.currentTime=Math.max(begin,end-0.22);started=true;}else if(started&&!video.seeking&&(end-video.currentTime>1.3||video.currentTime<begin))video.currentTime=Math.max(begin,end-0.22);if(video.currentTime-begin>5)await update(buffer,()=>buffer.remove(0,video.currentTime-3));}
   if(started&&video.paused)video.play().catch(()=>{});
  }
 }catch(error){if(closed||mine!==generation)return;hide(false,'Screen hidden while reconnecting. '+error.message);}
}
function draw(){if(closed)return;
 if(!privateScreen&&performance.now()-lastPolicy>1500)hide(false,'Screen hidden: connection status is unavailable.');
 if(!privateScreen&&video.readyState>=2&&video.videoWidth&&context){const rotate=orientation===6?Math.PI/2:orientation===8?-Math.PI/2:orientation===3?Math.PI:0,side=orientation===6||orientation===8,w=side?video.videoHeight:video.videoWidth,h=side?video.videoWidth:video.videoHeight;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}context.save();context.translate(w/2,h/2);context.rotate(rotate);context.drawImage(video,-video.videoWidth/2,-video.videoHeight/2);context.restore();cover.hidden=true;if(!frameReported){frameReported=true;notify(false,true,true);}}
 requestAnimationFrame(draw);
}
async function health(){if(closed)return;try{const meta=await info();lastPolicy=performance.now();orientation=meta.orientation||1;
 if(meta.hidden!==false){localHold=false;revision=Number(meta.privacyRevision)||0;if(!privateScreen||playing)hide(true,'PHONE SCREEN HIDDEN — open Google Maps before choosing Show screen.');else{status.textContent='PHONE SCREEN HIDDEN';cover.textContent='Phone screen hidden. Open Google Maps before choosing Show screen.';notify(true,true);}}
 else if(!localHold){
  if(Number.isFinite(meta.ageMs)&&meta.ageMs>4000){if(!privateScreen||playing)hide(false,'Screen hidden while waiting for fresh capture.');setTimeout(health,400);return;}
  const nextRevision=Number(meta.privacyRevision)||0;
  if(nextRevision<revision){setTimeout(health,400);return;}revision=nextRevision;
  if(meta.ready){if(!playing||activeEpoch!==meta.epoch){stopStream();activeEpoch=meta.epoch;privateScreen=false;playing=true;run(meta,generation);}status.textContent=meta.ageMs<4000?'Live iPhone screen · Hide screen BEFORE switching apps':'Waiting for a fresh screen frame';}
  else if(!privateScreen)hide(false,'Waiting for fresh screen capture.');
 }
 }catch{if(!closed)hide(false,'Screen hidden: connection lost. Hide is NOT confirmed on the iPhone.');}
 if(!closed)setTimeout(health,400);
}
async function setPrivacy(hidden){if(hidden){localHold=true;hide(false,'Hiding screen… wait for confirmation before switching apps.');}try{const result=await request('/screen/privacy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hidden,expectedRevision:revision})}),meta=JSON.parse(new TextDecoder().decode(result.bytes));revision=Number(meta.privacyRevision)||0;if(hidden)hide(true,'PHONE SCREEN HIDDEN — you can now switch apps.');else{localHold=false;status.textContent='Waiting for a fresh screen frame…';}}catch{hide(false,'Could not confirm Hide. Keep Google Maps open or stop the system broadcast.');}}
document.getElementById('hide').onclick=()=>setPrivacy(true);document.getElementById('show').onclick=()=>setPrivacy(false);document.getElementById('retry').onclick=()=>{stopStream();};
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==viewerOrigin||!['screenlink-hide','screenlink-disconnected'].includes(event.data?.type))return;localHold=true;hide(false,'Hiding phone screen…');});
window.addEventListener('pagehide',()=>{closed=true;stopStream();});draw();health();
</script></html>
