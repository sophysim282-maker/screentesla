<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenLink · Live Maps screen</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#080d15;color:#d6e6fa;height:100%;font:12px system-ui;display:flex;flex-direction:column}header{padding:8px;text-align:center;min-height:42px}#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:black}canvas{max-width:100%;max-height:100%;object-fit:contain}video{display:none}.stale canvas{opacity:.45}button{background:#253b57;color:white;border:1px solid #6387b6;border-radius:5px;padding:4px 8px}</style>
<header><span id="status">Start ScreenLink screen broadcast, then open Google Maps.</span> <button id="retry">Reconnect</button></header><main id="stage"><canvas id="screen" width="444" height="960" aria-label="Live iPhone screen"></canvas></main><video id="source" autoplay muted playsinline disableRemotePlayback></video>
<script>
const token=new URLSearchParams(location.search).get('token'),video=document.getElementById('source'),canvas=document.getElementById('screen'),status=document.getElementById('status'),context=canvas.getContext('2d',{alpha:false});
const endpoint=path=>{const [route,...query]=path.split('&');return route+'?token='+encodeURIComponent(token)+(query.length?'&'+query.join('&'):'');},sleep=ms=>new Promise(r=>setTimeout(r,ms));let generation=0,objectURL=null,orientation=1,controller=null,closed=false;
async function request(path){const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),5000);controller=abort;try{const response=await fetch(endpoint(path),{cache:'no-store',signal:abort.signal});if(response.status===403){parent.postMessage({type:'screenlink-expired'},location.origin);throw Error('Viewer link changed');}const bytes=response.status===204?new ArrayBuffer(0):await response.arrayBuffer();if(!response.ok&&response.status!==204)throw Error('Stream HTTP '+response.status);return {response,bytes};}finally{clearTimeout(timer);}}
async function info(){const {bytes}=await request('/screen/info');return JSON.parse(new TextDecoder().decode(bytes));}
function update(buffer,fn){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>finish(Error('Map decoder timed out')),4000);const finish=error=>{clearTimeout(timer);buffer.removeEventListener('updateend',ready);buffer.removeEventListener('error',bad);error?reject(error):resolve();};const ready=()=>finish(),bad=()=>finish(Error('Map decoder rejected stream'));buffer.addEventListener('updateend',ready);buffer.addEventListener('error',bad);try{fn();}catch(error){finish(error);}});}
function clear(){controller?.abort();video.pause();video.removeAttribute('src');video.load();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=null;}
async function run(mine){
 if(!self.MediaSource){status.textContent='This browser needs MediaSource support for live screen capture. Try current Chrome on the Mac.';return;}
 while(!closed&&mine===generation){
  try{
   const meta=await info();if(mine!==generation)return;
   orientation=meta.orientation||1;if(!meta.ready){status.textContent='Waiting for screen broadcast. Start it in ScreenLink, then open Google Maps.';await sleep(500);continue;}
   const type='video/mp4; codecs="'+meta.codec+'"';if(!MediaSource.isTypeSupported(type))throw Error('Browser cannot decode this H.264 screen stream');
   const media=new MediaSource();objectURL=URL.createObjectURL(media);video.src=objectURL;
   await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Map player startup timed out')),5000);media.addEventListener('sourceopen',()=>{clearTimeout(timer);resolve();},{once:true});});if(mine!==generation)return;
   const buffer=media.addSourceBuffer(type);media.duration=Infinity;
   const init=await request('/screen/init.mp4');if(init.response.headers.get('X-Stream-Epoch')!==meta.epoch)throw Error('Screen stream restarted');await update(buffer,()=>buffer.appendBuffer(init.bytes));canvas.dataset.epoch=meta.epoch;let after=0,started=false;
   while(!closed&&mine===generation){
    const packet=await request('/screen/segments&after='+after+'&epoch='+encodeURIComponent(meta.epoch));if(mine!==generation)return;
    if(packet.response.status===204){await sleep(30);continue;}if(packet.response.headers.get('X-Stream-Epoch')!==meta.epoch)throw Error('Screen stream restarted');
    await update(buffer,()=>buffer.appendBuffer(packet.bytes));after=packet.response.headers.get('X-Last-ID')||after;
    if(video.error)throw Error(video.error.message||'Screen decoder error');
    if(video.buffered.length){const end=video.buffered.end(video.buffered.length-1),begin=video.buffered.start(video.buffered.length-1);if(!started&&end-begin>=0.12){video.currentTime=Math.max(begin,end-0.22);started=true;}else if(started&&!video.seeking&&(end-video.currentTime>1.3||video.currentTime<begin))video.currentTime=Math.max(begin,end-0.22);if(video.currentTime-begin>5)await update(buffer,()=>buffer.remove(0,video.currentTime-3));}
    if(started&&video.paused)video.play().catch(()=>{});
   }
  }catch(error){if(closed||mine!==generation)return;status.textContent='Reconnecting live screen… '+error.message;clear();await sleep(750);}
 }
}
function draw(){if(closed)return;if(video.readyState>=2&&video.videoWidth&&context){const rotate=orientation===6?Math.PI/2:orientation===8?-Math.PI/2:orientation===3?Math.PI:0,side=orientation===6||orientation===8,w=side?video.videoHeight:video.videoWidth,h=side?video.videoWidth:video.videoHeight;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}context.save();context.translate(w/2,h/2);context.rotate(rotate);context.drawImage(video,-video.videoWidth/2,-video.videoHeight/2);context.restore();}requestAnimationFrame(draw);}
async function health(){try{const meta=await info();orientation=meta.orientation||1;document.body.classList.toggle('stale',!meta.ready||meta.ageMs>4000);status.textContent=meta.ready&&meta.ageMs<4000?'Live iPhone screen · open Google Maps here':'Waiting for fresh screen capture · keep the system broadcast active';}catch{}if(!closed)setTimeout(health,1500);}
function start(){generation++;clear();run(generation);}document.getElementById('retry').onclick=start;
window.addEventListener('pagehide',()=>{closed=true;generation++;clear();});start();draw();setTimeout(health,1500);
</script></html>
