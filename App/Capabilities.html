<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenLink browser support</title><style>body{background:#10141c;color:white;font:18px system-ui;padding:20px}pre{white-space:pre-wrap}a{color:#6cf}</style><h1>ScreenLink browser support</h1><p>This reports browser capabilities, not successful video playback.</p><pre id="result">Checking…</pre><a href="/">Open viewer</a><script>
(async()=>{const report={origin:location.origin,secureContext:isSecureContext,VideoDecoder:typeof VideoDecoder==='function',AudioDecoder:typeof AudioDecoder==='function',serviceWorker:'serviceWorker' in navigator};
if(report.VideoDecoder){try{report.h264=(await VideoDecoder.isConfigSupported({codec:'avc1.42E01F',codedWidth:1280,codedHeight:720})).supported;}catch(e){report.h264Error=e.name;}}
if(report.AudioDecoder){try{report.aac=(await AudioDecoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2})).supported;}catch(e){report.aacError=e.name;}}
document.getElementById('result').textContent=JSON.stringify(report,null,2);})();
</script></html>
