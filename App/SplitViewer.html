<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenLink · Maps + YouTube</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080e17;color:#edf4ff;font:14px system-ui}body{display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;min-height:48px;background:#142033}button{background:#253b57;border:1px solid #6387b6;color:white;border-radius:6px;padding:6px 10px;cursor:pointer}#panels{--split:50%;display:grid;grid-template-columns:minmax(0,var(--split)) 14px minmax(0,1fr);flex:1;min-height:0;overflow:hidden}section{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}h2{font-size:12px;margin:0;padding:6px 10px;background:#172132}iframe{display:block;flex:1;width:100%;min-height:0;border:0;background:#000}#divider{padding:0;margin:0;min-width:14px;min-height:14px;border:0;border-radius:0;background:#375a83;cursor:col-resize;touch-action:none;position:relative}#divider:after{content:'';position:absolute;width:4px;height:40px;border-radius:3px;background:#a9c7e9;left:5px;top:calc(50% - 20px)}#divider:focus{outline:2px solid #d1e6ff;outline-offset:-2px}.dragging iframe{pointer-events:none}#panels.stacked{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,var(--split)) 14px minmax(0,1fr)}.stacked #divider{cursor:row-resize}.stacked #divider:after{width:40px;height:4px;left:calc(50% - 20px);top:5px}#hint{font-size:11px;color:#bfd0e7}@media(max-width:600px){header{flex-wrap:wrap}#hint{width:100%}}</style>
<header><span><strong>Maps + YouTube</strong> <span id="hint">Open Google Maps on the iPhone. Drag the middle bar to resize.</span></span><span><button id="layout">Stack panels</button> <button id="reset">50 / 50</button> <button id="full">Full screen</button></span></header>
<main id="panels"><section><h2>Live iPhone screen · Google Maps</h2><iframe id="map" title="Live Google Maps screen" allow="autoplay; fullscreen"></iframe></section><button id="divider" role="separator" tabindex="0" aria-label="Resize Maps and YouTube" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></button><section><h2>YouTube · video-only AirPlay</h2><iframe id="media" title="YouTube AirPlay video" allow="autoplay; fullscreen"></iframe></section></main>
<script>
const token=new URLSearchParams(location.search).get('token'),panels=document.getElementById('panels'),divider=document.getElementById('divider');
for(const [id,path] of [['map','/map'],['media','/video']])document.getElementById(id).src=path+'?token='+encodeURIComponent(token);
let split=50,stacked=matchMedia('(orientation:portrait)').matches;
try{const saved=JSON.parse(localStorage.getItem('screenlink-split-v1'));if(saved&&Number.isFinite(saved.split)){split=saved.split;stacked=!!saved.stacked;}}catch{}
function apply(save=true){split=Math.max(20,Math.min(80,split));panels.style.setProperty('--split',split+'%');panels.classList.toggle('stacked',stacked);divider.setAttribute('aria-valuenow',Math.round(split));divider.setAttribute('aria-orientation',stacked?'horizontal':'vertical');document.getElementById('layout').textContent=stacked?'Side by side':'Stack panels';if(save)try{localStorage.setItem('screenlink-split-v1',JSON.stringify({split,stacked}));}catch{}}
function move(event){const r=panels.getBoundingClientRect();split=100*((stacked?event.clientY-r.top:event.clientX-r.left)/(stacked?r.height:r.width));apply();}
divider.onpointerdown=event=>{event.preventDefault();divider.setPointerCapture(event.pointerId);panels.classList.add('dragging');move(event);};
divider.onpointermove=event=>{if(divider.hasPointerCapture(event.pointerId))move(event);};
for(const name of ['pointerup','pointercancel','lostpointercapture'])divider.addEventListener(name,()=>panels.classList.remove('dragging'));
divider.onkeydown=event=>{if(['ArrowLeft','ArrowUp','ArrowRight','ArrowDown','Home','End'].includes(event.key)){event.preventDefault();split=event.key==='Home'?20:event.key==='End'?80:split+(['ArrowLeft','ArrowUp'].includes(event.key)?-2:2);apply();}};
divider.ondblclick=()=>{split=50;apply();};document.getElementById('reset').onclick=()=>{split=50;apply();};document.getElementById('layout').onclick=()=>{stacked=!stacked;apply();};document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});window.addEventListener('message',event=>{if(event.origin!==location.origin||![document.getElementById('map').contentWindow,document.getElementById('media').contentWindow].includes(event.source)||event.data?.type!=='screenlink-expired')return;let last=0;try{last=Number(sessionStorage.getItem('screenlink-token-refresh'));sessionStorage.setItem('screenlink-token-refresh',Date.now());}catch{}if(Date.now()-last>5000)location.replace('/split');else document.getElementById('hint').textContent='Viewer connection changed. Reopen the fixed hotspot link after the broadcast starts.';});apply(false);
</script></html>
