<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenLink · Video only</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10141c;color:#fff;font:15px system-ui;text-align:center}header{padding:12px;height:115px}p{margin:5px}button,a{display:inline-block;padding:7px 12px;background:#25354b;border:1px solid #547091;border-radius:7px;color:#fff;text-decoration:none;margin:3px}#stage{height:calc(100dvh - 190px);background:#000;display:flex;align-items:center;justify-content:center}canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}video{display:none}header{min-height:190px}input{vertical-align:middle;width:160px}select{background:#25354b;color:white;padding:6px;border-radius:6px}#detail{font-size:12px;color:#bfcbdf}</style>
<header><p id="status">Waiting for YouTube AirPlay…</p><p id="detail">On iPhone: YouTube → Cast → AirPlay &amp; Bluetooth devices → ScreenLink VPN Phone.</p><button id="sound">Play with sound</button><button id="reconnect">Reconnect</button><button id="full">Full screen</button><button id="pause">Pause / Play</button><p><label>Seek <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek video"></label> <label>Sound <select id="eq"><option value="normal">Normal</option><option value="music">Music</option></select></label> <label>Quality <select id="quality"><option value="hd">HD preferred</option></select></label> <span id="resolution">No decoded video</span></p></header><main id="stage"><canvas id="canvas" width="640" height="360" aria-label="AirPlay video"></canvas></main>
<video id="player" autoplay muted playsinline controls disableRemotePlayback></video>
<script>
const token=new URLSearchParams(location.search).get('token'),player=document.getElementById('player'),status=document.getElementById('status'),detail=document.getElementById('detail');
const endpoint=path=>path+'?token='+encodeURIComponent(token);
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage');
let codecPlayer=null,forceCompatibility=false,canvasReason='',drawHandle=0,drawKind='',audioGraph=null;
const media=()=>codecPlayer||player;
let current='',command=-1,hls=null,lastError='',state=null,loadingHLS=null,mediaRecoveries=0;
let requestedQuality='hd';
let engine='none',generation=0,fallbackPending=false,nativeRetries=0,stallRetries=0,lastPosition=0,lastProgress=performance.now();
async function request(path,options={}){const control=new AbortController(),timeout=setTimeout(()=>control.abort(),6000);try{const r=await fetch(endpoint(path),{cache:'no-store',...options,signal:control.signal});if(r.status===403&&parent!==window)parent.postMessage({type:'screenlink-expired'},location.origin);if(!r.ok)throw Error('Receiver returned '+r.status);return await r.json();}finally{clearTimeout(timeout);}}
async function library(){if(window.Hls)return;if(!loadingHLS)loadingHLS=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=endpoint('/media/hls.js');s.onload=resolve;s.onerror=()=>{loadingHLS=null;reject(Error('HLS player could not load'));};document.head.appendChild(s);});await loadingHLS;}
async function script(path,globalName){if(window[globalName])return;await new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src=endpoint(path);tag.onload=resolve;tag.onerror=()=>{tag.remove();reject(Error('Canvas player library could not load'));};document.head.appendChild(tag);});}
async function canvasLibrary(){await script('/media/canvas.js','ScreenLinkCanvas');await script('/media/mp4box.js','MP4Box');await script('/media/mux.js','muxjs');}
function drawVideo(){
 const context=canvas.getContext('2d',{alpha:false});if(!context){canvas.style.display='none';player.style.display='block';player.style.width='100%';player.style.height='100%';stage.appendChild(player);player.controls=true;return;}
 let last=-1;
 const draw=()=>{if(codecPlayer)return;if(player.readyState>=2&&player.videoWidth&&player.currentTime!==last){if(canvas.width!==player.videoWidth||canvas.height!==player.videoHeight){canvas.width=player.videoWidth;canvas.height=player.videoHeight;}document.getElementById('resolution').textContent=player.videoWidth+' × '+player.videoHeight+' decoded';context.drawImage(player,0,0,canvas.width,canvas.height);last=player.currentTime;}drawKind='raf';drawHandle=requestAnimationFrame(draw);};draw();
}
function qualityMenu(heights){const select=document.getElementById('quality');select.replaceChildren();for(const [value,label] of [['hd','HD preferred'],...[...new Set(heights)].sort((a,b)=>b-a).map(h=>[String(h),h+'p'])]){const option=document.createElement('option');option.value=value;option.textContent=label;select.appendChild(option);}if(requestedQuality!=='hd'&&!heights.includes(Number(requestedQuality)))requestedQuality='hd';select.value=requestedQuality;}
function selectHLSQuality(client,initial=false){const levels=client.levels.map((level,index)=>({...level,index}));let candidates=levels.filter(level=>requestedQuality==='hd'?level.height>0&&level.height<=1080:level.height===Number(requestedQuality));if(!candidates.length)candidates=levels;const chosen=candidates.sort((a,b)=>(b.height||0)-(a.height||0)||(b.bitrate||0)-(a.bitrate||0))[0];client.autoLevelCapping=-1;if(chosen){if(initial){client.loadLevel=chosen.index;client.startLevel=chosen.index;}else client.currentLevel=chosen.index;}}
function clear(){
 if(drawHandle){if(drawKind==='video')player.cancelVideoFrameCallback?.(drawHandle);else cancelAnimationFrame(drawHandle);drawHandle=0;}
 if(codecPlayer){codecPlayer.destroy();codecPlayer=null;}
if(hls){hls.destroy();hls=null;}player.pause();player.removeAttribute('src');player.load();}
function errorText(){const error=media().error;return error?('MediaError '+error.code+': '+(error.message||'decoder rejected media')):lastError;}
function feedback(){const active=media();return {epoch:current,command,position:Number.isFinite(active.currentTime)?active.currentTime:0,duration:Number.isFinite(active.duration)?active.duration:0,paused:active.paused,ready:active.readyState>=2&&!active.error,ended:active.ended,error:errorText()};}
function recordError(message){lastError=message;request('/media/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...feedback(),error:message})}).catch(()=>{});}
async function start(next,nativeOnly=false,preserve=false){
 const resume=preserve?media().currentTime:0;current=next.epoch;command=-1;if(!preserve){lastError='';nativeRetries=0;stallRetries=0;forceCompatibility=false;canvasReason='';}mediaRecoveries=0;fallbackPending=false;clear();
 const source=next.url,mine=++generation;lastPosition=0;lastProgress=performance.now();
 const seek=()=>{if(mine!==generation)return;const position=resume>0?resume:(next.start>0?next.start:(next.fraction>0&&Number.isFinite(player.duration)?next.fraction*player.duration:0));if(position>0)player.currentTime=position;};
 player.addEventListener('loadedmetadata',seek,{once:true});
 if(!nativeOnly&&!forceCompatibility&&self.isSecureContext&&self.VideoDecoder&&self.AudioDecoder){
  try{
   await canvasLibrary();if(mine!==generation)return;
   const direct=new ScreenLinkCanvas.CanvasPlayer(canvas,{quality:requestedQuality,onerror:error=>{if(codecPlayer!==direct)return;recordError('Canvas decoder: '+error.message);canvasReason='Decoder compatibility fallback';forceCompatibility=true;fallbackPending=true;}});codecPlayer=direct;
   engine='WebCodecs → Canvas + Web Audio';await direct.load(source,resume>0?resume:(next.start||0));if(mine!==generation){direct.destroy();return;}
   if(next.fraction>0&&!resume&&!next.start)direct.currentTime=next.fraction*direct.duration;
   direct.muted=player.muted;if(!player.muted){await direct.enableAudio();direct.setEQ(document.getElementById('eq').value);}qualityMenu(direct.offeredHeights);await direct.play();return;
  }catch(error){if(mine!==generation)return;codecPlayer?.destroy();codecPlayer=null;forceCompatibility=true;canvasReason=error.message;}
 }else if(!self.isSecureContext)canvasReason='Direct WebCodecs requires HTTPS; Canvas display uses the compatible decoder';
 const native=!!player.canPlayType('application/vnd.apple.mpegurl');
 if(!nativeOnly){try{await library();}catch(error){if(!native)throw error;}}
 if(mine!==generation)return;
 if(!nativeOnly && window.Hls && Hls.isSupported()){
  engine='HLS.js';const client=new Hls({maxBufferLength:20,maxMaxBufferLength:40,backBufferLength:15,capLevelToPlayerSize:false,autoStartLoad:false});hls=client;
  client.on(Hls.Events.MANIFEST_PARSED,()=>{if(hls!==client)return;qualityMenu(client.levels.map(level=>level.height).filter(Boolean));selectHLSQuality(client,true);client.startLoad();});
  client.on(Hls.Events.ERROR,(_event,data)=>{if(hls!==client||mine!==generation||!data.fatal)return;
   recordError((data.type||'HLS')+'/'+(data.details||'unknown')+(data.response?.code?' HTTP '+data.response.code:''));
   if(data.type===Hls.ErrorTypes.NETWORK_ERROR && mediaRecoveries++<2)client.startLoad();
   else if(data.type===Hls.ErrorTypes.MEDIA_ERROR && mediaRecoveries++<2)client.recoverMediaError();
   else fallbackPending=native;
  });
  client.on(Hls.Events.FRAG_BUFFERED,()=>{if(hls===client)lastError='';});client.loadSource(source);client.attachMedia(player);
 }else if(native){engine='Native HLS';player.src=source;}
 else throw Error('This browser cannot play HLS video. Try Safari or Chrome on your Mac.');
 drawVideo();player.play().catch(()=>{detail.textContent='Press Play with sound to start playback.';});
}
async function tick(){
 try{const next=await request('/media/state');state=next;
  if(!next.active){if(current){clear();current='';generation++;}status.textContent='Waiting for YouTube AirPlay…';detail.textContent=next.error||'Start video-only AirPlay in ScreenLink, then select ScreenLink from YouTube’s AirPlay menu.';return;}
  if(next.epoch!==current)await start(next);
  if(next.command!==command){command=next.command;if(next.commandKind==='seek'&&(codecPlayer||media().readyState))media().currentTime=next.seek;if(next.paused)media().pause();else media().play().catch(()=>{});}
  await request('/media/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(feedback())});
  if(codecPlayer&&canvas.width>0&&codecPlayer.stats.drawn>0)document.getElementById('resolution').textContent=canvas.width+' × '+canvas.height+' decoded';
  status.textContent=media().error?'Video playback error · see details below':(media().readyState<2?'Loading video-only AirPlay…':(media().paused?'Video paused':'Video-only AirPlay · '+Math.floor(media().currentTime)+' seconds'));
  document.getElementById('seek').value=Number.isFinite(media().duration)&&media().duration>0?100*media().currentTime/media().duration:0;
  detail.textContent=engine+' · '+(canvasReason?canvasReason+' · ':'')+(errorText()||next.error||(media().muted?'Press Play with sound to enable audio.':'Original video + audio'));
  if(fallbackPending){await start(next,engine==='HLS.js',true);return;}
  if(media().error&&engine==='Native HLS'&&nativeRetries++<1){recordError(errorText());await start(next,true,true);return;}
  const now=performance.now();if(Math.abs(media().currentTime-lastPosition)>0.05||media().paused){lastPosition=media().currentTime;lastProgress=now;}
  if(!media().paused&&media().readyState>=2&&now-lastProgress>8000&&stallRetries++<2){recordError('Playback stalled; rebuilding browser player');await start(next,engine==='Native HLS',true);}
 }catch(error){status.textContent='Waiting for ScreenLink connection…';detail.textContent=error.message;}
 finally{setTimeout(tick,1000);}
}
async function enableSound(){
 player.muted=false;
 if(codecPlayer){await codecPlayer.enableAudio();codecPlayer.setEQ(document.getElementById('eq').value);return;}
 await player.play();
 const Audio=self.AudioContext||self.webkitAudioContext;
 if(Audio){
  if(!audioGraph){const context=new Audio(),source=context.createMediaElementSource(player),low=context.createBiquadFilter(),high=context.createBiquadFilter();low.type='lowshelf';low.frequency.value=180;high.type='highshelf';high.frequency.value=3500;source.connect(low).connect(high).connect(context.destination);audioGraph={context,low,high};}
  await audioGraph.context.resume();applyEQ();
 }
}
function applyEQ(){const music=document.getElementById('eq').value==='music';if(codecPlayer)codecPlayer.setEQ(music?'music':'normal');if(audioGraph){audioGraph.low.gain.value=music?3:0;audioGraph.high.gain.value=music?2:0;}}
document.getElementById('sound').onclick=()=>enableSound().catch(error=>{detail.textContent=error.message;});
document.getElementById('eq').onchange=applyEQ;
document.getElementById('quality').onchange=async event=>{requestedQuality=event.target.value;if(hls)selectHLSQuality(hls);else if(codecPlayer&&state)await start(state,false,true);};
document.getElementById('pause').onclick=()=>{const active=media();if(active.paused)active.play().catch(()=>{});else active.pause();};
document.getElementById('seek').onchange=event=>{if(Number.isFinite(media().duration))media().currentTime=Number(event.target.value)*media().duration/100;};
document.getElementById('reconnect').onclick=()=>{current='';};
document.getElementById('full').onclick=()=>{stage.requestFullscreen?.().catch(()=>{});};
window.addEventListener('online',()=>{current='';});
window.addEventListener('pagehide',()=>{generation++;clear();audioGraph?.context.close();});
tick();
</script></html>
