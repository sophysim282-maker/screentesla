<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ScreenLink · WebRTC pairing test</title>
<style>body{max-width:700px;margin:24px auto;padding:0 16px;background:#101827;color:#edf4ff;font:16px system-ui}input,button{font:inherit;padding:12px;border-radius:8px;margin:4px}input{width:160px}button{background:#335b8b;color:white;border:1px solid #7196c4}pre{white-space:pre-wrap;font:13px monospace;background:#17253a;padding:14px;border-radius:8px}#status{font-weight:700}small{display:block;line-height:1.5}</style>
<h1>ScreenLink pairing test</h1><p>Connect to the iPhone hotspot. Keep ScreenLink’s WebRTC test screen open on the phone. Enter its code, then approve this viewer on the phone.</p><small>Milestone 1: connection and ping only. No video, audio, camera or screen capture. Test in a parked vehicle.</small>
<p><input id="code" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6-digit code" aria-label="Pairing code"><button id="join">Pair</button><button id="stop">Stop</button><button id="copy">Copy diagnostics</button></p><p id="status" role="status">Ready</p><pre id="events"></pre>
<script>
(()=>{'use strict';
const API='https://tesla4khmer.com/api/public/screenlink',status=document.getElementById('status'),events=document.getElementById('events');
let peer=null,channel=null,joinId='',secret='',generation=0,revision=0,timer=null,pingTimer=null,polling=false,lastHeartbeat=0,lastPong=0,pingSent=false,negotiating=false,lastStats={},verified=false,signalingAlive=true;
const log=message=>{events.textContent+=(new Date().toISOString()+' '+message+'\n');events.textContent=events.textContent.slice(-8000);};
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function call(method,path,body,auth=true){const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),8000);try{const response=await fetch(API+path,{method,cache:'no-store',redirect:'error',credentials:'omit',referrerPolicy:'no-referrer',headers:{Accept:'application/json',...(body?{'Content-Type':'application/json'}:{}),...(auth?{Authorization:'Viewer '+secret}:{})},body:body?JSON.stringify(body):undefined,signal:abort.signal});const data=response.status===204?{}:await response.json();if(!response.ok){const error=Error('Signaling HTTP '+response.status);error.code=response.status;throw error;}return data;}finally{clearTimeout(timeout);}}
function attach(next){if(next.label!=='ping'){next.close();return;}channel=next;channel.onopen=()=>{log('Data channel open; checking real traffic.');ping();pingTimer=setInterval(ping,3000);};channel.onmessage=event=>{if(typeof event.data!=='string'||event.data.length>4096)return;if(event.data==='ping'){if(channel.readyState==='open'){channel.send('pong');lastPong=performance.now();}}else if(event.data==='pong'&&pingSent)lastPong=performance.now();};}
function ping(){if(channel?.readyState==='open'){channel.send('ping');pingSent=true;}}
async function gather(connection){if(connection.iceGatheringState==='complete')return 'complete';const until=performance.now()+3000;while(connection.iceGatheringState!=='complete'&&performance.now()<until&&connection.signalingState!=='closed')await delay(30);return connection.iceGatheringState==='complete'?'complete':'timeout';}
async function acceptOffer(mine){if(negotiating)return;negotiating=true;try{const offer=await call('GET','/join/'+joinId+'/offer');if(mine!==generation)return;if(offer.negotiationRevision===revision)return;
 if(!peer){peer=new RTCPeerConnection({iceServers:[],iceCandidatePoolSize:0});peer.ondatachannel=event=>attach(event.channel);peer.onconnectionstatechange=()=>log('Peer state: '+peer.connectionState);}
 await peer.setRemoteDescription({type:'offer',sdp:offer.sdpOffer});const answer=await peer.createAnswer();await peer.setLocalDescription(answer);const iceGathering=await gather(peer);if(mine!==generation)return;
 if(!peer.localDescription.sdp.includes('a=candidate:'))throw Error('No local candidates were gathered.');revision=offer.negotiationRevision;
 await call('POST','/join/'+joinId+'/answer',{sdpAnswer:peer.localDescription.sdp,iceGathering,negotiationRevision:revision});log('Answer submitted. Waiting for peer connectivity; this is not yet a connection.');
 }finally{negotiating=false;}}
async function snapshot(){if(!peer)return {};const report=await peer.getStats();let pair=null;report.forEach(item=>{if(item.type==='transport'&&item.selectedCandidatePairId)pair=report.get(item.selectedCandidatePairId);});if(!pair)report.forEach(item=>{if(item.type==='candidate-pair'&&item.nominated&&item.state==='succeeded')pair=item;});const local=report.get(pair?.localCandidateId)||{},remote=report.get(pair?.remoteCandidateId)||{};let bytesReceived=pair?.bytesReceived||0,bytesSent=pair?.bytesSent||0;
 const pingOK=lastPong>0&&performance.now()-lastPong<15000;const result={connectionState:peer.connectionState,bytesReceived,bytesSent,dataChannelPingOk:pingOK,framesRendered:0,selectedPair:{local:(local.address||local.ip||'unavailable')+':'+(local.port||0),remote:(remote.address||remote.ip||'unavailable')+':'+(remote.port||0),protocol:local.protocol||'unknown'},verified:peer.connectionState==='connected'&&channel?.readyState==='open'&&pingOK&&bytesReceived>0&&bytesSent>0};return result;}
async function poll(mine){if(mine!==generation||polling||!joinId)return;polling=true;try{
 if(!signalingAlive){lastStats=await snapshot();verified=!!lastStats.verified;status.textContent=verified?'Local ping verified · signaling expired':'Local ping unavailable · start a new pairing';return;}
 const state=await call('GET','/join/'+joinId+'/status');if(mine!==generation)return;
 if(state.status==='pending_approval'){status.textContent='Approve the viewer request on your iPhone.';return;}
 if(['closed','expired','rejected'].includes(state.status))throw Error('Pairing is '+state.status);
 if(state.negotiationRevision!==revision)await acceptOffer(mine);if(mine!==generation)return;
 lastStats=await snapshot();if(lastStats.verified!==verified){verified=lastStats.verified;log(verified?'Real bidirectional ping verified. Check the selected route in diagnostics.':'Ping verification is not currently fresh.');}
 status.textContent=verified?'WebRTC ping verified · no video yet':'Waiting for WebRTC ping…';
 if(revision&&performance.now()-lastHeartbeat>10000){lastHeartbeat=performance.now();const body={...lastStats,state:verified?'connected':'heartbeat',negotiationRevision:revision};delete body.verified;await call('POST','/join/'+joinId+'/state',body);}
 }catch(error){if(mine!==generation)return;status.textContent=verified?'Local ping continues; signaling unavailable.':error.message;log(error.message);if(error.code===410||error.code===401){signalingAlive=false;log('Signaling expired; established peer retained and ping verification continues. Stop explicitly to close it.');}}
 finally{polling=false;}}
async function stop(){generation++;clearInterval(timer);clearInterval(pingTimer);timer=null;pingTimer=null;const oldId=joinId,oldSecret=secret;joinId='';secret='';channel?.close();peer?.close();channel=null;peer=null;revision=0;lastPong=0;lastHeartbeat=0;pingSent=false;verified=false;signalingAlive=true;polling=false;negotiating=false;lastStats={};status.textContent='Stopped';document.getElementById('join').disabled=false;
 if(oldId&&oldSecret){const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),5000);try{await fetch(API+'/join/'+oldId,{method:'DELETE',redirect:'error',credentials:'omit',headers:{Authorization:'Viewer '+oldSecret},signal:abort.signal});}catch{}finally{clearTimeout(timeout);}}}
document.getElementById('join').onclick=async()=>{if(!/^\d{6}$/.test(document.getElementById('code').value)){status.textContent='Enter the six-digit code displayed by ScreenLink.';return;}await stop();const mine=++generation;document.getElementById('join').disabled=true;try{if(!isSecureContext||!self.RTCPeerConnection)throw Error('This browser needs HTTPS and RTCPeerConnection support.');const result=await call('POST','/join',{pairingCode:document.getElementById('code').value},false);if(mine!==generation)return;if(!/^[A-Za-z0-9-]{1,128}$/.test(result.joinId)||!/^[0-9a-f]{64}$/i.test(result.viewerSecret))throw Error('Join response did not match contract v2.');joinId=result.joinId;secret=result.viewerSecret;document.getElementById('code').value='';status.textContent='Approve this viewer on the iPhone.';timer=setInterval(()=>poll(mine),1000);await poll(mine);}catch(error){status.textContent=error.message;document.getElementById('join').disabled=false;}};
document.getElementById('stop').onclick=stop;
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify({milestone:'ping-only',userAgent:navigator.userAgent,snapshot:lastStats,events:events.textContent},null,2));log('Sanitized diagnostics copied. No SDP, codes or role secrets included.');};
window.addEventListener('pagehide',()=>{generation++;clearInterval(timer);clearInterval(pingTimer);channel?.close();peer?.close();});
})();
</script></html>
