name: ScreenLinkAirPlayLab
options:
  deploymentTarget:
    iOS: '15.0'
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.airplaylab
    CLANG_ENABLE_OBJC_ARC: true
    GCC_PREPROCESSOR_DEFINITIONS:
    - $(inherited)
    - OPENSSL_API_COMPAT=0x10100000L
    HEADER_SEARCH_PATHS:
    - $(SRCROOT)/App
    - $(SRCROOT)/RTC
    - $(SRCROOT)/Shared
    - $(SRCROOT)/deps/include
    - $(SRCROOT)/Vendor/RPiPlay/lib
    - $(SRCROOT)/Vendor/RPiPlay/lib/playfair
    - $(SRCROOT)/Vendor/RPiPlay/lib/llhttp
    LIBRARY_SEARCH_PATHS:
    - $(SRCROOT)/deps/lib
    OTHER_LDFLAGS:
    - $(inherited)
    - -lssl
    - -lcrypto
    - -lplist-2.0
    - -lz
    ENABLE_BITCODE: false
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  ScreenLinkAirPlayLab:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
    - path: Shared
    - path: Activity
    - path: Maps
    - path: RTC
    - path: App
    - path: Vendor/RPiPlay/lib
      excludes:
      - '**/CMakeLists.txt'
      - '**/*.md'
    settings:
      base:
        SWIFT_VERSION: '5.0'
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/ScreenLink.entitlements
      properties:
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
    dependencies:
    - framework: Vendor/WebRTC.xcframework
      embed: true
    - target: ScreenLinkBroadcast
      embed: true
    - target: ScreenLinkWidgets
      embed: true
    - package: GoogleMaps
      product: GoogleMaps
    - sdk: ActivityKit.framework
      weak: true
    - sdk: AppIntents.framework
      weak: true
    - sdk: ReplayKit.framework
    - target: ScreenLinkLocalTunnel
      embed: true
    - sdk: NetworkExtension.framework
    - sdk: AVKit.framework
    - sdk: AVFoundation.framework
    - sdk: UIKit.framework
    - sdk: Foundation.framework
    - sdk: VideoToolbox.framework
    - sdk: CoreMedia.framework
    - sdk: CoreVideo.framework
    - sdk: CoreImage.framework
    - sdk: ImageIO.framework
    - sdk: QuartzCore.framework
    - sdk: BackgroundTasks.framework
    - sdk: UniformTypeIdentifiers.framework
    - sdk: UserNotifications.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ScreenLink
        CFBundleShortVersionString: 0.20.67
        CFBundleVersion: '104'
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
        - CFBundleURLName: ScreenLink
          CFBundleURLSchemes:
          - screenlink
        UIBackgroundModes:
        - audio
        - processing
        - location
        - bluetooth-central
        NSBluetoothAlwaysUsageDescription: ScreenLink Maps sends the next turn of your route to an Orbit Cube display.
        NSLocationWhenInUseUsageDescription: ScreenLink Maps uses your location for navigation on the car screen.
        NSMicrophoneUsageDescription: ScreenLink Maps uses the microphone for voice search.
        NSSpeechRecognitionUsageDescription: ScreenLink Maps turns your voice into a search.
        BGTaskSchedulerPermittedIdentifiers:
        - local.screenlink.airplaylab.casting.*
        - local.screenlink.airplaylab.3TY7CJCWLP.casting.*
        - 3TY7CJCWLP.local.screenlink.airplaylab.casting.*
        - 3TY7CJCWLP.local.screenlink.airplaylab.3TY7CJCWLP.casting.*
        NSLocalNetworkUsageDescription: Advertise an experimental AirPlay receiver and share received video with your local browser.
        NSBonjourServices:
        - _airplay._tcp
        - _raop._tcp
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ScreenLinkLocalTunnel:
    type: app-extension
    platform: iOS
    sources:
    - path: Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.airplaylab.LocalTunnel
        PRODUCT_NAME: ScreenLinkLocalTunnel
        APPLICATION_EXTENSION_API_ONLY: true
        OTHER_LDFLAGS:
        - $(inherited)
        SKIP_INSTALL: true
    dependencies:
    - sdk: NetworkExtension.framework
    - sdk: Foundation.framework
    entitlements:
      path: Tunnel/LocalTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: ScreenLink Local VPN
        CFBundleShortVersionString: 0.20.67
        CFBundleVersion: '104'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: PacketTunnelProvider
  ScreenLinkBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: '16.0'
    sources:
    - path: Broadcast
    - path: RTC
      excludes:
      - RTCPrototypeController.h
      - RTCPrototypeController.m
      - SLMediaController.h
      - SLMediaController.m
    - path: App
      excludes:
      - main.m
      - LocalVPN.h
      - LocalVPN.m
      - BackgroundSession.h
      - BackgroundSession.m
      - FloatingPreview.h
      - FloatingPreview.m
      - YouTubePiP.h
      - YouTubePiP.m
      - ScreenLinkHomeView.h
      - ScreenLinkHomeView.m
      - StreamNotifier.h
      - StreamNotifier.m
      - BrandAssets.xcassets
      - ScreenLinkCover.png
      - Info.plist
      - '*.entitlements'
    - path: Vendor/RPiPlay/lib
      excludes:
      - '**/CMakeLists.txt'
      - '**/*.md'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.airplaylab.Broadcast
        PRODUCT_NAME: ScreenLinkBroadcast
        LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/Frameworks'
        - '@executable_path/../../Frameworks'
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)
        - SL_BROADCAST_EXTENSION=1
    dependencies:
    - framework: Vendor/WebRTC.xcframework
      embed: false
    - sdk: ReplayKit.framework
    - sdk: UIKit.framework
    - sdk: Foundation.framework
    - sdk: VideoToolbox.framework
    - sdk: CoreMedia.framework
    - sdk: CoreVideo.framework
    - sdk: CoreImage.framework
    - sdk: ImageIO.framework
    - sdk: QuartzCore.framework
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties: {}
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: ScreenLink Screen
        CFBundleShortVersionString: 0.20.67
        CFBundleVersion: '104'
        NSLocalNetworkUsageDescription: Share the live iPhone screen and AirPlay media with your hotspot viewer during a screen broadcast.
        NSBonjourServices:
        - _airplay._tcp
        - _raop._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
  ScreenLinkWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Widgets
    - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.screenlink.airplaylab.Widgets
        PRODUCT_NAME: ScreenLinkWidgets
        SWIFT_VERSION: '5.0'
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        OTHER_LDFLAGS: []
    dependencies:
    - sdk: WidgetKit.framework
    - sdk: SwiftUI.framework
    - sdk: ActivityKit.framework
    - sdk: AppIntents.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ScreenLink
        CFBundleShortVersionString: 0.20.67
        CFBundleVersion: '104'
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  ScreenLinkAirPlayLab:
    build:
      targets:
        ScreenLinkAirPlayLab: all

